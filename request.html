<!DOCTYPE html>
<html>
<head>
    <title>Special Request 💌</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="surprise-page">

    <div class="letter">

        <div class="heart">💗</div>

        <h1>My little present for you 💌</h1>

        <p>
            Okay... one last thing. 😌
        </p>

        <p>
            I have a little question for you.
        </p>

        <h2>
            What is one thing you want from me as a present? 🌷
        </h2>

        <p>
            I want to do my best to fulfill your wish. (မှတ်ချက်။ အရုပ်လိုချင်ပါက သုံးသောင်းအောက်သာဝယ်ပေးနိုင်မည်🥹
        </p>

        <form
            action="https://formspree.io/f/xyeznbpa"
            method="POST">

            <textarea
                name="message"
                placeholder="Write your answer here... 💌"

                Send To Me 💗
            </button>

        </form>

    </div>

</html>
